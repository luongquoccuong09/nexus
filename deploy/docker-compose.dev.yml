# Local development / M0.8 demo stack (PostgreSQL 17 + separate migrator/runtime roles + Nexus.Web)
# Usage: docker compose -f deploy/docker-compose.dev.yml up --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NexusDatabase__RequireTls: "false"
      ConnectionStrings__Migration: "Host=postgres;Port=5432;Database=nexus;Username=nexus_migrator;Password=nexus_migrator_dev_only"
    command: ["--migrate"]
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      NexusDatabase__RequireTls: "false"
      ConnectionStrings__Runtime: "Host=postgres;Port=5432;Database=nexus;Username=nexus_runtime;Password=nexus_runtime_dev_only"
      NexusStorage__Provider: "Local"
      NexusStorage__LocalRootPath: "/app/App_Data/storage"
    volumes:
      - nexus_storage:/app/App_Data/storage

volumes:
  nexus_pgdata:
  nexus_storage:
